name: Build site from content.md

on:
  push:
    branches: [main]
    paths:
      - "content.md"
      - "_template/**"
      - "build.py"
      - ".github/workflows/build.yml"

# Allow this workflow to commit the rebuilt index.html back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install --quiet pyyaml jinja2

      - name: Build index.html
        run: python3 build.py

      - name: Commit rebuilt index.html if changed
        run: |
          git config user.name  "interdependent-bot"
          git config user.email "interdependent-bot@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes to index.html — nothing to commit."
          else
            git add index.html
            git commit -m "chore: rebuild index.html from content.md [skip ci]"
            git push
          fi
