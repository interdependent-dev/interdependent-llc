name: Build site from content.md

on:
  push:
    branches: [main]
    paths:
      - "content.md"
      - "_template/**"
      - "build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

# Allow this workflow to commit the rebuilt HTML files back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install --quiet pyyaml jinja2

      - name: Build all HTML pages
        run: python3 build.py

      - name: Commit rebuilt HTML files if changed
        # build.py renders index.html, privacy.html, terms.html, and 404.html
        # from shared partials in _template/. Commit any of those that changed.
        run: |
          git config user.name  "interdependent-bot"
          git config user.email "interdependent-bot@users.noreply.github.com"
          if git diff --quiet -- index.html privacy.html terms.html 404.html; then
            echo "No changes to HTML output — nothing to commit."
          else
            git add index.html privacy.html terms.html 404.html
            git commit -m "chore: rebuild HTML from content.md [skip ci]"
            git push
          fi
